# 웹판 자동 배포: 릴리즈를 게시하면, 거기 첨부한 RockmanXSurvivors_Web_*.zip을 풀어서 GitHub Pages에 올린다.
# 웹판 파일을 저장소에 커밋하지 않으므로 저장소 기록(용량)이 늘지 않는다.
# 넣는 위치: 릴리즈 저장소의 .github/workflows/deploy-web.yml
# 처음 한 번: 저장소 Settings > Pages > Source를 "GitHub Actions"로 설정.
# 2026-11-03: 릴리즈 전용 저장소는 릴리즈마다 커밋이 같아, 커밋 번호를 배포 번호로 쓰는 deploy-pages가
#   "이미 배포됨"으로 처리하고 새 웹판을 반영하지 않았다. 배포 번호에 실행 번호를 붙여 매번 새로 배포한다(릴리즈 전 커밋 불필요).
name: Deploy web build

on:
  release:
    types: [published]   # 릴리즈를 게시할 때
  workflow_dispatch:      # Actions 탭에서 직접 실행(가장 최근 릴리즈로 다시 배포)

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - name: Download web zip from release
        id: zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if gh release download $TAG --repo "${{ github.repository }}" --pattern 'RockmanXSurvivors_Web_*.zip' --output web.zip; then
            mkdir -p site
            unzip -q web.zip -d site
            touch site/.nojekyll
            echo "올릴 웹판:"; ls site/Build
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "이 릴리즈에는 웹판 zip이 없어 배포하지 않습니다(웹판은 그대로 유지)."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload site
        id: upload
        if: steps.zip.outputs.found == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # deploy-pages 대신 직접 배포: 배포 번호 = 커밋 + 실행 번호(같은 커밋이어도 매번 새 배포)
      - name: Deploy to GitHub Pages
        if: steps.zip.outputs.found == 'true'
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            let artifactId = Number(process.env.ARTIFACT_ID);
            if (!artifactId) {   // 출력이 비어 있으면 이번 실행의 github-pages 묶음을 찾아 쓴다
              const { data: list } = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts', {
                owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId,
              });
              const found = list.artifacts.find(a => a.name === 'github-pages');
              if (!found) return core.setFailed('올린 웹판 묶음(github-pages)을 찾지 못했습니다.');
              artifactId = found.id;
            }
            const token = await core.getIDToken();
            const version = `${context.sha}-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner: context.repo.owner, repo: context.repo.repo,
              artifact_id: artifactId,
              pages_build_version: version,
              oidc_token: token,
            });
            core.info(`배포 시작: ${version} (ID ${data.id})`);
            for (let i = 0; i < 60; i++) {
              await new Promise(r => setTimeout(r, 10000));
              const { data: st } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', {
                owner: context.repo.owner, repo: context.repo.repo, id: data.id,
              });
              core.info(`상태: ${st.status}`);
              if (st.status === 'succeed') { core.info(`완료: ${data.page_url}`); return; }
              if (['deployment_failed', 'deployment_content_failed', 'deployment_lost', 'deployment_cancelled', 'deployment_attempt_error'].includes(st.status))
                return core.setFailed(`배포 실패: ${st.status}`);
            }
            core.setFailed('배포가 10분 안에 끝나지 않았습니다.');
