# Deploy automático da versão web: quando uma release é publicada, pega o RockmanXSurvivors_Web_*.zip anexado a ela, extrai e sobe para o GitHub Pages.
# Os arquivos da versão web não são commitados no repositório, então o histórico (e o peso dele) não cresce.
# Onde colocar: .github/workflows/deploy-web.yml do repositório das releases
# Primeira vez: configure Settings > Pages > Source como "GitHub Actions".
# 2026-11-03: o repositório só de releases tem o mesmo commit em toda release, então o deploy era tratado como "já publicado" e a nova versão web não aparecia.
# 2026-11-04: usar o número da execução como número de deploy (um valor que não é commit) fez a Pages API devolver 404.
#   → a cada deploy é criado um commit vazio, com o mesmo conteúdo, no branch web-deploy, e o deploy usa o número desse commit.
#     (nada muda no branch main nem nos arquivos; o branch web-deploy é só de deploy, pode ser ignorado)
name: Deploy web build

on:
  release:
    types: [published]   # quando a release for publicada
  workflow_dispatch:      # execução manual na aba Actions (redistribui usando a release mais recente)

permissions:
  contents: write   # commit vazio de deploy (branch web-deploy)
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - name: Download web zip from release
        id: zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if gh release download $TAG --repo "${{ github.repository }}" --pattern 'RockmanXSurvivors_Web_*.zip' --output web.zip; then
            mkdir -p site
            unzip -q web.zip -d site
            touch site/.nojekyll
            echo "Versão web que será publicada:"; ls site/Build
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "Esta release não tem o zip da versão web, então nada é publicado (a versão atual continua no ar)."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload site
        id: upload
        if: steps.zip.outputs.found == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.zip.outputs.found == 'true'
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          TAG: ${{ github.event.release.tag_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            let artifactId = Number(process.env.ARTIFACT_ID);
            if (!artifactId) {   // se a saída vier vazia, procura o pacote github-pages desta execução e usa ele
              const { data: list } = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts', { owner, repo, run_id: context.runId });
              const found = list.artifacts.find(a => a.name === 'github-pages');
              if (!found) return core.setFailed('Não encontrei o pacote da versão web (github-pages) que foi enviado.');
              artifactId = found.id;
            }

            // novo commit que serve de número do deploy: um commit vazio, com o mesmo conteúdo do atual, criado no branch web-deploy
            const { data: base } = await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha });
            const { data: commit } = await github.rest.git.createCommit({
              owner, repo, tree: base.tree.sha, parents: [context.sha],
              message: `web deploy ${process.env.TAG || ''} (run ${context.runId})`,
            });
            try {
              await github.rest.git.updateRef({ owner, repo, ref: 'heads/web-deploy', sha: commit.sha, force: true });
            } catch (e) {
              if (e.status !== 422 && e.status !== 404) throw e;
              await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/web-deploy', sha: commit.sha });
            }
            core.info(`Número do deploy (commit): ${commit.sha}`);

            const token = await core.getIDToken();
            let data;
            try {
              ({ data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                owner, repo, artifact_id: artifactId, pages_build_version: commit.sha, oidc_token: token,
              }));
            } catch (e) {
              if (e.status === 404)
                return core.setFailed('Pages API devolveu 404: confirme que em Settings > Pages > Source do repositório está marcado "GitHub Actions".');
              throw e;
            }
            core.info(`Deploy iniciado (ID ${data.id})`);
            for (let i = 0; i < 60; i++) {
              await new Promise(r => setTimeout(r, 10000));
              const { data: st } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id: data.id });
              core.info(`Status: ${st.status}`);
              if (st.status === 'succeed') { core.info(`Concluído: ${data.page_url}`); return; }
              if (['deployment_failed', 'deployment_content_failed', 'deployment_lost', 'deployment_cancelled', 'deployment_attempt_error'].includes(st.status))
                return core.setFailed(`Falha no deploy: ${st.status}`);
            }
            core.setFailed('O deploy não terminou dentro de 10 minutos.');
